[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-life-os"
version = "1.20.0"
description = "The personal OS that grows with you - mood, sleep, nutrition and habit tracking with pattern detection, built for Ollama/OpenAI/Anthropic/OpenRouter."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Kıvanç" },
]
keywords = ["life-os", "self-tracking", "llm-agent", "habit-tracker", "mood-tracker", "ollama", "anthropic", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34.0"]
dashboard = ["matplotlib>=3.7.0"]
encryption = ["cryptography>=42.0.0"]
voice = ["faster-whisper>=1.0.0"]
discord = ["discord.py>=2.3.0"]
slack = ["slack_bolt>=1.18.0"]
whatsapp = ["flask>=3.0.0", "twilio>=8.0.0"]
api = ["flask>=3.0.0"]
web = ["flask>=3.0.0"]
all = ["anthropic>=0.34.0", "matplotlib>=3.7.0", "cryptography>=42.0.0", "faster-whisper>=1.0.0", "discord.py>=2.3.0", "slack_bolt>=1.18.0", "flask>=3.0.0", "twilio>=8.0.0"]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/Lethe044/hermes-life-os"
Repository = "https://github.com/Lethe044/hermes-life-os"
Issues = "https://github.com/Lethe044/hermes-life-os/issues"

[project.scripts]
hermes-life-os = "hermes_life_os.demo_life_os:main"
hermes-life-os-dashboard = "hermes_life_os.dashboard:main"
hermes-life-os-scheduler = "hermes_life_os.run_scheduler:main"
hermes-life-os-import = "hermes_life_os.health_import:main"
hermes-life-os-export = "hermes_life_os.data_export:main"
hermes-life-os-calendar = "hermes_life_os.calendar_import:main"
hermes-life-os-telegram = "hermes_life_os.telegram_bot:main"
hermes-life-os-oura = "hermes_life_os.oura_import:main"
hermes-life-os-weekly-email = "hermes_life_os.weekly_email:main"
hermes-life-os-wrapped = "hermes_life_os.wrapped:main"
hermes-life-os-review = "hermes_life_os.life_review:main"
hermes-life-os-leaderboard = "hermes_life_os.leaderboard:main"
hermes-life-os-backup = "hermes_life_os.backup:main"
hermes-life-os-discord = "hermes_life_os.discord_bot:main"
hermes-life-os-slack = "hermes_life_os.slack_bot:main"
hermes-life-os-users = "hermes_life_os.users:main"
hermes-life-os-plugins = "hermes_life_os.plugins:main"
hermes-life-os-rekey = "hermes_life_os.rekey:main"
hermes-life-os-api = "hermes_life_os.local_api:main"
hermes-life-os-web = "hermes_life_os.web_dashboard:main"
hermes-life-os-whatsapp = "hermes_life_os.whatsapp_bot:main"

[tool.setuptools]
# The package's real source lives in demo/ (kept as-is so existing docs,
# Docker, and CI commands like `python demo/demo_life_os.py` keep working
# unchanged) - this just also exposes it as an installable package.
package-dir = { "hermes_life_os" = "demo" }
packages = ["hermes_life_os"]
