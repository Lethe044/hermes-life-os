<circle cx="22" cy="18" r="6" fill="#f87171"/><circle cx="42" cy="18" r="6" fill="#fbbf24"/><circle cx="62" cy="18" r="6" fill="#4ade80"/>
<text x="430" y="22" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">hermes-life-os</text>
<text x="24" y="62" xml:space="preserve" fill="#a5b4fc" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">&gt; plan my day</text>
<text x="24" y="95" xml:space="preserve" fill="#e2e8f0" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">Plan for 2026-10-13 (proposal, nothing saved yet):</text>
<text x="24" y="117" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">- 09:00-09:30 Ship the release (priority, 30 min)</text>
<text x="24" y="139" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">- 09:35-11:05 Write report (due, 90 min)</text>
<text x="24" y="161" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">- 11:10-11:25 Email Sam (due, 15 min)</text>
<text x="24" y="183" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">Free time left: 10h30.</text>
<text x="24" y="205" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">Run plan_my_day again with apply=true to save these as time blocks.</text>
<text x="24" y="238" xml:space="preserve" fill="#a5b4fc" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">&gt; how is my life wheel?</text>
<text x="24" y="271" xml:space="preserve" fill="#e2e8f0" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">Life wheel on 2026-10-13 (average 5.8/10):</text>
<text x="24" y="293" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">- health        #######... 7/10</text>
<text x="24" y="315" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">- career        ########.. 8/10</text>
<text x="24" y="337" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">- money         ###....... 3/10</text>
<text x="24" y="359" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">- relationships ######.... 6/10</text>
<text x="24" y="381" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">- growth        #####..... 5/10</text>
<text x="24" y="403" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">- fun           ####...... 4/10</text>
<text x="24" y="425" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">- environment   #######... 7/10</text>
<text x="24" y="447" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">- purpose       ######.... 6/10</text>
<text x="24" y="469" xml:space="preserve" fill="#cbd5e1" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="14">Needs attention: money, fun. Add a goal, task or routine for the lowest one.</text>
