name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran.
      placeholder: |
        hermes-life-os --mode morning --provider ollama
        ...
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: LLM provider
      description: ollama / openai / anthropic / openrouter
    validations:
      required: true

  - type: input
    id: install-method
    attributes:
      label: How did you install it?
      description: pip / source (git clone) / Docker
    validations:
      required: true

  - type: input
    id: os-python
    attributes:
      label: OS and Python version
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / traceback
      render: shell
    validations:
      required: false
