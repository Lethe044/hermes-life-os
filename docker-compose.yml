# Zero-install, zero-API-key trial: Hermes Life OS + a local Ollama server.
#
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull llama3.1   # first time only
#   docker compose run --rm hermes-life-os --mode onboard
#   docker compose run --rm hermes-life-os --mode morning
#   docker compose run --rm hermes-life-os --mode chat
#
# Already have an Anthropic/OpenAI/OpenRouter key instead? Skip the ollama
# service and run:
#   docker compose run --rm -e ANTHROPIC_API_KEY=sk-ant-... hermes-life-os --mode morning

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"

  hermes-life-os:
    build: .
    depends_on:
      - ollama
    environment:
      LIFE_OS_PROVIDER: ollama
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - hermes-life-os-data:/root/.hermes
    stdin_open: true
    tty: true

volumes:
  ollama-models:
  hermes-life-os-data:
